name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Compact toolchain (compiler 0.36.0, as pinned in the harness)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update 0.36.0
          "$HOME/.local/bin/compact" compile --version
      - name: Harness dependencies
        working-directory: evals
        run: npm ci
      - name: Every task's reference solution passes its hidden tests
        run: ./evals/harness/check-references.sh
      - name: Consent contract tests
        run: ./contract/test.sh
      - name: compile-mcp build and tests
        working-directory: compile-mcp
        run: npm ci && npm run build && npm test
